#Compose describes how containers work together
services:
  # Docker created the containers postgres and api
  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: analytics_db

    ports:
      - "5433:5432"
    # stores data seperately from an container
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "analytics", "-d", "analytics_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ../..
      dockerfile: backend/docker/DockerFile

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL}
      # Local demo controls only; leave disabled on public deployments without authentication.
      ENABLE_DEMO_STREAM: "true"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
